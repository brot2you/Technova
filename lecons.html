<script type="application/json" id="lecons-data">[{"id":"chaine-info","icone":"📡","titre":"La chaîne d’information","zone":"robot","paras":["Un système automatisé (un robot, un portail, un lampadaire intelligent) réagit à son environnement. Pour cela, il manipule des informations en trois temps.","Acquérir : un capteur mesure une grandeur physique (distance, luminosité, température, présence) et la transforme en signal. Traiter : une carte programmable (microcontrôleur) exécute un programme qui compare la mesure et décide. Communiquer : le système envoie un ordre aux actionneurs ou un message à l’utilisateur (écran, voyant, application).","Quand un système ne fonctionne pas, on vérifie chaque maillon dans l’ordre : la mesure est-elle correcte ? le programme décide-t-il bien ? l’ordre est-il transmis ?"],"retenir":["Acquérir → traiter → communiquer.","Le capteur acquiert, la carte programmable traite, l’interface ou le module de communication communique.","Un capteur ne décide rien : c’est le programme qui décide."],"vocab":[["Capteur","composant qui mesure une grandeur physique"],["Microcontrôleur","petit ordinateur sur une carte, qui exécute le programme"],["Interface","ce qui permet d’échanger avec l’utilisateur (écran, bouton, voyant)"]],"question":{"q":"Un portail s’ouvre quand une télécommande envoie un signal. Quel élément acquiert l’information ?","options":[{"t":"Le récepteur radio du portail","ok":true,"fb":"Il capte le signal de la télécommande : c’est l’acquisition."},{"t":"Le moteur du portail","ok":false,"fb":"Le moteur agit (il appartient à la chaîne d’énergie), il n’acquiert pas d’information."},{"t":"La carte de commande","ok":false,"fb":"La carte traite l’information reçue, elle ne la capte pas elle-même."},{"t":"Le voyant clignotant","ok":false,"fb":"Le voyant communique (il prévient les passants), il n’acquiert rien."}]}},{"id":"chaine-energie","icone":"🔋","titre":"La chaîne d’énergie","zone":"robot","paras":["Pour agir sur le monde réel (avancer, ouvrir, chauffer, éclairer), un système a besoin d’énergie. La chaîne d’énergie décrit son parcours.","Alimenter : une source fournit l’énergie (batterie, secteur, panneau solaire). Distribuer : un composant laisse passer ou non l’énergie selon les ordres de la chaîne d’information (relais, variateur, carte de commande des moteurs). Convertir : un actionneur transforme l’énergie (un moteur convertit l’énergie électrique en énergie mécanique). Transmettre : des engrenages, une courroie ou des roues transmettent le mouvement.","Les deux chaînes travaillent ensemble : la chaîne d’information décide, la chaîne d’énergie exécute."],"retenir":["Alimenter → distribuer → convertir → transmettre.","L’actionneur (moteur, lampe, résistance chauffante) convertit l’énergie.","La distribution est commandée par la chaîne d’information."],"vocab":[["Actionneur","composant qui agit sur l’environnement en convertissant l’énergie"],["Transmission","pièces qui transportent le mouvement (engrenages, courroie, roues)"]],"question":{"q":"Dans une trottinette électrique, quel élément convertit l’énergie ?","options":[{"t":"Le moteur dans la roue","ok":true,"fb":"Il transforme l’énergie électrique en énergie mécanique : il convertit."},{"t":"La batterie","ok":false,"fb":"La batterie stocke et fournit l’énergie : elle alimente."},{"t":"La gâchette d’accélération","ok":false,"fb":"La gâchette est un capteur : elle acquiert la demande du conducteur."},{"t":"Le contrôleur électronique","ok":false,"fb":"Le contrôleur dose l’énergie envoyée au moteur : il distribue."}]}},{"id":"algorithmes","icone":"💻","titre":"Algorithmes et programmes","zone":"robot","paras":["Un algorithme est une suite d’instructions qui résout un problème. Un programme est l’écriture de cet algorithme dans un langage que la machine comprend (Scratch, Python…).","Trois structures reviennent sans cesse. La séquence : les instructions s’exécutent dans l’ordre. La condition : SI une comparaison est vraie ALORS on fait une action, SINON on en fait une autre. La boucle : on répète des instructions (un nombre de fois, ou indéfiniment).","Dans un système automatisé, la boucle contient presque toujours une nouvelle mesure : sans mesure à jour, le programme compare une valeur périmée et ne réagit plus."],"retenir":["Séquence, condition (SI… ALORS… SINON), boucle (RÉPÉTER).","Une condition est une comparaison vraie ou fausse, jamais une action.","On teste un programme dans plusieurs situations, y compris les cas limites."],"vocab":[["Variable","case mémoire qui contient une valeur pouvant changer (la distance mesurée)"],["Seuil","valeur de référence à laquelle on compare une mesure"]],"question":{"q":"Quelle ligne peut se placer juste après « SI » ?","options":[{"t":"température > 25 °C","ok":true,"fb":"C’est une comparaison, vraie ou fausse : une condition."},{"t":"allumer le ventilateur","ok":false,"fb":"C’est une action : elle se place après ALORS ou SINON."},{"t":"répéter 10 fois","ok":false,"fb":"C’est le début d’une boucle, pas une condition."},{"t":"mesurer la température","ok":false,"fb":"C’est une action d’acquisition, qu’on fait avant de comparer."}]}},{"id":"energie-puissance","icone":"⚡","titre":"Énergie et puissance","zone":"energy","paras":["La puissance (en watts, W) indique la quantité d’énergie qu’un appareil utilise à chaque instant. L’énergie (en wattheures, Wh) dépend de la puissance ET de la durée d’utilisation.","On calcule : E = P × t, avec P en watts et t en heures. Une lampe de 10 W allumée 3 h consomme 10 × 3 = 30 Wh. Attention aux minutes : 30 min = 0,5 h ; 20 min = 20 ÷ 60 h ≈ 0,33 h.","Pour les grandes quantités, on utilise le kilowattheure : 1 kWh = 1 000 Wh. C’est l’unité de la facture d’électricité."],"retenir":["E (Wh) = P (W) × t (h).","Toujours convertir la durée en heures.","1 kWh = 1 000 Wh."],"vocab":[["Watt (W)","unité de puissance"],["Wattheure (Wh)","unité d’énergie : 1 W pendant 1 h"]],"question":{"q":"Un radiateur de 1 500 W fonctionne 2 h. Quelle énergie consomme-t-il ?","options":[{"t":"3 kWh","ok":true,"fb":"1 500 × 2 = 3 000 Wh, soit 3 kWh."},{"t":"750 Wh","ok":false,"fb":"Tu as divisé au lieu de multiplier : E = P × t."},{"t":"1 502 Wh","ok":false,"fb":"On n’additionne pas une puissance et une durée : on les multiplie."},{"t":"3 000 kWh","ok":false,"fb":"3 000 est bien le résultat, mais en Wh, pas en kWh."}]}},{"id":"conversions","icone":"☀️","titre":"Formes et conversions d’énergie","zone":"energy","paras":["L’énergie existe sous plusieurs formes : lumineuse, électrique, mécanique (mouvement), thermique (chaleur), chimique (stockée dans une batterie ou un carburant).","Un convertisseur transforme une forme en une autre : le panneau photovoltaïque convertit l’énergie lumineuse en énergie électrique, le moteur l’énergie électrique en énergie mécanique, la LED l’énergie électrique en énergie lumineuse. La batterie stocke l’énergie électrique sous forme chimique et la restitue plus tard.","Aucune conversion n’est parfaite : une partie de l’énergie est perdue, souvent sous forme de chaleur. Une lampe à LED chauffe beaucoup moins qu’une halogène : elle perd moins d’énergie pour le même éclairage."],"retenir":["Panneau photovoltaïque : lumineuse → électrique.","Moteur : électrique → mécanique. LED : électrique → lumineuse.","Toute conversion a des pertes, souvent en chaleur."],"vocab":[["Énergie renouvelable","issue d’une source qui se reconstitue (Soleil, vent, eau)"],["Rendement","part de l’énergie reçue qui est réellement utile"]],"question":{"q":"Pourquoi une lampe halogène consomme-t-elle plus qu’une LED pour le même éclairage ?","options":[{"t":"Elle perd une grande partie de l’énergie en chaleur","ok":true,"fb":"Son rendement est faible : beaucoup d’énergie électrique devient chaleur plutôt que lumière."},{"t":"Elle éclaire plus longtemps","ok":false,"fb":"La durée d’allumage est la même dans la comparaison."},{"t":"Elle fonctionne au gaz","ok":false,"fb":"L’halogène est une lampe électrique ; le gaz à l’intérieur ne lui sert pas de carburant."},{"t":"Elle produit de l’énergie chimique","ok":false,"fb":"Une lampe ne produit pas d’énergie chimique : elle convertit de l’électricité en lumière et en chaleur."}]}},{"id":"reseaux","icone":"🌐","titre":"Les réseaux informatiques","zone":"cyber","paras":["Un réseau relie des machines pour qu’elles échangent des données. Au collège, les ordinateurs forment un réseau local, reliés par un commutateur (switch) ou par des bornes Wi-Fi.","Le routeur relie ce réseau local à d’autres réseaux, donc à Internet. Chaque machine possède une adresse IP qui l’identifie, un peu comme une adresse postale.","Les données voyagent en petits paquets. Une requête vers un site web part du poste, traverse le commutateur, le routeur, puis les routeurs d’Internet, jusqu’au serveur qui héberge le site ; la réponse fait le chemin inverse."],"retenir":["Commutateur : relie les machines d’un même réseau local.","Routeur : relie des réseaux entre eux.","Adresse IP : identifie une machine sur le réseau."],"vocab":[["Serveur","ordinateur qui fournit un service (site web, messagerie, ENT)"],["Paquet","petit morceau de données envoyé sur le réseau"]],"question":{"q":"Quel équipement permet au réseau du collège d’accéder à Internet ?","options":[{"t":"Le routeur","ok":true,"fb":"Il relie le réseau local aux autres réseaux, dont Internet."},{"t":"Le commutateur","ok":false,"fb":"Il relie les machines du réseau local entre elles, mais ne fait pas le lien vers l’extérieur."},{"t":"Le serveur de l’ENT","ok":false,"fb":"C’est une destination sur Internet, pas l’équipement qui y donne accès."},{"t":"La carte réseau de l’ordinateur","ok":false,"fb":"Elle relie un seul ordinateur au réseau local."}]}},{"id":"securite","icone":"🔐","titre":"Se protéger sur le réseau","zone":"cyber","paras":["L’hameçonnage (phishing) est un faux message qui imite un service connu pour voler des identifiants. Indices fréquents : adresse d’expéditeur bizarre, urgence ou menace, message impersonnel, lien qui mène ailleurs, demande de mot de passe.","Un bon mot de passe est long et unique pour chaque service. Une phrase de passe (plusieurs mots sans lien) est à la fois robuste et facile à retenir. La double authentification ajoute une seconde preuve (un code reçu sur un téléphone).","Sur un ordinateur partagé, on se déconnecte et on n’enregistre jamais ses mots de passe. On installe les mises à jour, qui corrigent des failles de sécurité."],"retenir":["Message douteux : ne pas cliquer, vérifier par un autre moyen, signaler.","Un mot de passe long et différent pour chaque service.","Double authentification et mises à jour."],"vocab":[["Hameçonnage","faux message qui cherche à voler des informations"],["Double authentification","connexion qui demande deux preuves différentes"]],"question":{"q":"Quel mot de passe est le plus robuste ?","options":[{"t":"girafe-tournevis-nuage-violon","ok":true,"fb":"Long, fait de mots sans lien : très difficile à deviner, facile à retenir."},{"t":"Technova2026!","ok":false,"fb":"Un mot connu, une année et un symbole à la fin : c’est exactement ce que les logiciels d’attaque essaient en premier."},{"t":"P@ssw0rd","ok":false,"fb":"Remplacer des lettres par des symboles est une astuce connue des attaquants."},{"t":"X7$k","ok":false,"fb":"Très court : un ordinateur teste toutes les combinaisons en un instant."}]}},{"id":"conception","icone":"📐","titre":"Concevoir un objet","zone":"maker","paras":["Tout objet technique répond à un besoin. Avant de dessiner, on écrit le cahier des charges : les fonctions (ce que l’objet doit faire pour l’utilisateur) et les contraintes (les limites à respecter : prix, dimensions, matériau, procédé, sécurité).","On choisit ensuite les matériaux en croisant leurs propriétés (rigidité, masse, résistance, recyclabilité) avec les contraintes. Puis on fabrique un prototype.","Le prototype est testé : on modifie un paramètre à la fois, on note chaque essai et on compare aux critères du cahier des charges. On améliore jusqu’à trouver la meilleure solution."],"retenir":["Fonction = service rendu. Contrainte = limite imposée.","Un critère mesurable permet de vérifier (« moins de 3 € », « flèche ≤ 2 mm »).","Essais notés, un paramètre à la fois."],"vocab":[["Cahier des charges","document qui liste fonctions et contraintes d’un objet à concevoir"],["Prototype","premier exemplaire fabriqué pour tester une solution"]],"question":{"q":"Pour une gourde, laquelle de ces phrases est une contrainte ?","options":[{"t":"Contenir au moins 50 cl et peser moins de 150 g","ok":true,"fb":"Ce sont des limites chiffrées à respecter : des contraintes."},{"t":"Permettre de transporter de l’eau","ok":false,"fb":"C’est le service rendu : une fonction."},{"t":"Permettre de boire sans renverser","ok":false,"fb":"C’est aussi un service rendu à l’utilisateur : une fonction."},{"t":"L’utilisateur aime le sport","ok":false,"fb":"C’est une information sur l’utilisateur, pas une exigence vérifiable sur l’objet."}]}},{"id":"cycle-vie","icone":"♻️","titre":"Cycle de vie et écoconception","zone":"eco","paras":["Le cycle de vie d’un objet comprend cinq étapes : extraction des matières premières, fabrication, transport et distribution, utilisation, fin de vie (réemploi, recyclage, élimination).","Chaque étape a un impact sur l’environnement. Pour les appareils numériques, la fabrication pèse le plus lourd : garder un appareil plus longtemps est souvent le geste le plus efficace. Pour une voiture, c’est au contraire l’utilisation qui pèse le plus.","L’écoconception consiste à réduire ces impacts dès la conception : moins de matière, matériaux recyclés, pièces vissées et remplaçables, faible consommation."],"retenir":["Extraction → fabrication → transport → utilisation → fin de vie.","L’étape qui pèse le plus dépend de l’objet.","Écoconcevoir : agir sur toutes les étapes dès la conception."],"vocab":[["Écoconception","conception qui réduit l’impact environnemental sur tout le cycle de vie"],["Réemploi","réutiliser un objet tel quel, sans le détruire"]],"question":{"q":"Quel choix de conception facilite le plus la réparation d’un ordinateur portable ?","options":[{"t":"Une batterie vissée qu’on peut remplacer","ok":true,"fb":"La batterie s’use la première : si on peut la changer, l’ordinateur dure plus longtemps."},{"t":"Une coque collée pour être plus fine","ok":false,"fb":"La colle empêche d’ouvrir l’appareil sans le casser."},{"t":"Une mémoire soudée à la carte mère","ok":false,"fb":"Soudée, la mémoire ne peut être ni remplacée ni augmentée."},{"t":"Un chargeur avec un connecteur unique à la marque","ok":false,"fb":"Un connecteur propriétaire complique le remplacement du chargeur."}]}}]</script>
