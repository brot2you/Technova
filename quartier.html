rainte."},{"t":"Accueillir des téléphones de 6,5 à 8 cm de large","ok":["Contrainte"],"fb":"c’est une limite chiffrée que la solution doit respecter : une contrainte."},{"t":"Être fabriqué avec l’imprimante 3D du collège","ok":["Contrainte"],"fb":"le procédé de fabrication est imposé : c’est une contrainte."},{"t":"Permettre de recharger le téléphone sans le retirer","ok":["Fonction"],"fb":"c’est un service rendu à l’utilisateur : une fonction."},{"t":"Le téléphone possède un écran OLED","ok":["Hors sujet"],"fb":"cela décrit le téléphone, pas le support à concevoir."}],"hint":"Une fonction commence souvent par un verbe d’action au service de l’utilisateur. Une contrainte fixe une limite : prix, dimensions, matériau, procédé…","retenir":"Le cahier des charges décrit les fonctions de l’objet et les contraintes à respecter, si possible avec des critères mesurables."},"m2":{"type":"qcm","scene":{"type":"icon","icone":"🧱","nom":"Atelier de prototypage"},"consigne":"Le cahier des charges impose une fabrication avec l’imprimante 3D du collège. Cette imprimante n’a pas d’enceinte fermée. Le budget est serré.","doc":{"titre":"Fiche matériaux","table":{"head":["Matériau","Imprimable en 3D ?","Remarques","Prix"],"rows":[["PLA","Oui, facilement","Rigide, issu de matières végétales","€"],["ABS","Oui, mais enceinte fermée nécessaire","Résistant aux chocs, se déforme et dégage des vapeurs à l’air libre","€"],["Contreplaqué","Non (découpe laser)","Rigide et léger","€"],["Acier","Non (atelier de métallerie)","Très rigide, lourd","€€€"]]}},"question":"Quel matériau choisir pour le support ?","options":[{"t":"Le PLA","ok":true,"fb":"Imprimable sans enceinte, rigide et bon marché : il respecte toutes les contraintes."},{"t":"L’ABS","ok":false,"fb":"Il est imprimable, mais sans enceinte fermée il se déforme et dégage des vapeurs. L’imprimante du collège n’en a pas."},{"t":"Le contreplaqué","ok":false,"fb":"Bon matériau, mais il se travaille à la découpeuse laser. Le cahier des charges impose l’impression 3D."},{"t":"L’acier","ok":false,"fb":"Trop cher, trop lourd, et impossible à travailler avec l’imprimante 3D."}],"hint":"Élimine d’abord les matériaux qui ne respectent pas la contrainte de fabrication, puis regarde les conditions d’impression.","retenir":"On choisit un matériau en croisant ses propriétés avec les contraintes du cahier des charges, procédé de fabrication compris."},"m3":{"type":"protoTest","scene":{"type":"proto","nom":"Banc d’essai"},"consigne":"Le crochet de porte-manteau imprimé en 3D doit porter un manteau de 2 kg en fléchissant de 2 mm au maximum. Pour économiser la matière, il doit être le plus fin possible.","question":"Fais des essais en changeant l’épaisseur, note les résultats, puis valide le meilleur réglage.","min":1,"max":8,"step":0.5,"start":6,"k":54,"rho":6,"fmax":2,"best":3,"hint":"Commence par une épaisseur qui tient, puis diminue pas à pas : le bon réglage est le dernier qui respecte encore 2 mm.","retenir":"Un prototype s’améliore par des essais notés : on modifie un seul paramètre à la fois et on compare au cahier des charges."},"o1":{"type":"numeric","scene":{"type":"icon","icone":"🚲","nom":"Observatoire écologique"},"consigne":"Léa habite à 3 km du collège. Elle y allait en voiture et passe au vélo pour l’aller et le retour, 180 jours par an.","doc":{"titre":"Émissions de gaz à effet de serre par personne et par km (ordre de grandeur)","table":{"head":["Mode de transport","kg CO₂e par km"],"rows":[["Voiture thermique, une personne","0,22"],["Bus","0,11"],["Vélo","0"],["Marche","0"]]}},"question":"Combien de kg de CO₂e Léa évite-t-elle en un an ? Arrondis à l’unité.","unit":"kg CO₂e","answer":238,"tol":1.5,"errors":[{"v":119,"tol":1.5,"fb":"Tu n’as compté qu’un seul trajet par jour. Léa fait l’aller ET le retour : 2 × 3 km."},{"v":1080,"tol":1,"fb":"1 080, c’est la distance parcourue en km sur l’année. Multiplie-la par les émissions par km."},{"v":1.32,"tol":0.02,"fb":"Ce sont les émissions d’une seule journée. Multiplie par 180 jours."}],"hint":"Distance par an : 2 × 3 km × 180 jours. Puis multiplie par 0,22 kg par km.","retenir":"Pour comparer des solutions de mobilité, on calcule l’impact sur une durée réaliste (une année) et pour un même service rendu."},"o2":{"type":"order","scene":{"type":"icon","icone":"♻️","nom":"Observatoire écologique"},"consigne":"Pour évaluer l’impact environnemental d’un smartphone, on étudie toutes les étapes de son cycle de vie.","question":"Remets les étapes du cycle de vie dans l’ordre. Une étiquette est un piège.","items":[{"t":"⛏️ Extraction des matières premières","why":"Tout commence par l’extraction des métaux et des matières : c’est la première étape."},{"t":"🏭 Fabrication","why":"Les matières sont transformées en composants puis assemblées : la fabrication suit l’extraction."},{"t":"🚚 Transport et distribution","why":"Une fois fabriqué, l’appareil est acheminé vers les magasins : cela vient après la fabrication."},{"t":"📱 Utilisation","why":"L’utilisation commence une fois l’appareil acheté, après sa distribution."},{"t":"♻️ Fin de vie (réemploi, recyclage)","why":"La fin de vie arrive quand l’appareil n’est plus utilisé : c’est la dernière étape."},{"t":"✏️ Conception","fb":"La conception n’est pas une étape du cycle de vie de l’objet : c’est le moment où l’on décide de l’impact de toutes les étapes (écoconception)."}],"answer":[0,1,2,3,4],"hint":"Suis le parcours de la matière : d’où vient-elle, que devient-elle, comment arrive-t-elle jusqu’à toi, et où finit-elle ?","retenir":"Cycle de vie : extraction → fabrication → transport → utilisation → fin de vie. L’écoconception agit sur toutes ces étapes."},"o3":{"type":"qcm","scene":{"type":"icon","icone":"📱","nom":"Observatoire écologique"},"consigne":"Pour un smartphone, la fabrication représente la plus grande part de l’impact environnemental, autour des trois quarts. La recharge pèse très peu.","question":"Quel geste réduit le plus l’impact de ton smartphone ?","options":[{"t":"Le garder plus longtemps et le faire réparer en cas de panne","ok":true,"fb":"Chaque année d’utilisation en plus évite une fabrication, la phase qui pèse le plus."},{"t":"Le recharger moins souvent","ok":false,"fb":"La recharge représente une petite part de l’impact. Le gain existe, mais il est faible."},{"t":"Le recycler chaque année pour un modèle plus économe en énergie","ok":false,"fb":"Changer souvent multiplie les fabrications, la phase la plus lourde. Recycler est utile en fin de vie, pas pour changer plus vite."},{"t":"Choisir un chargeur rapide","ok":false,"fb":"La vitesse de charge ne change pas l’énergie nécessaire, et un chargeur neuf est un objet de plus à fabriquer."}],"hint":"Relis la consigne : quelle étape du cycle de vie pèse le plus ? Quel geste permet d’éviter de la répéter ?","retenir":"Pour les appareils numériques, allonger la durée d’usage (réparer, réemployer) est le geste le plus efficace."},"f1":{"type":"steps","scene":{"type":"image","src":"./assets/eclairage-nuit.webp","alt":"Rue éclairée la nuit","nom":"Défi final"},"consigne":"La ville remplace ses 40 lampadaires et les pilote à distance. Trois étapes : calculer le gain, sécuriser le système, analyser l’automatisme.","steps":[{"type":"numeric","doc":{"titre":"Données","lignes":["40 lampadaires de 100 W remplacés par des lampadaires LED de 40 W.","Chaque lampadaire éclaire 4 000 h par an."]},"question":"Quelle énergie la ville économise-t-elle par an ?","unit":"kWh","answer":9600,"tol":1,"errors":[{"v":9600000,"tol":1,"fb":"Le calcul est juste, mais en Wh : divise par 1 000."},{"v":240,"tol":0.5,"fb":"240 kWh, c’est l’économie pour un seul lampadaire. Il y en a 40."},{"v":16000,"tol":1,"fb":"16 000 kWh, c’est la consommation des anciens lampadaires. On demande l’économie."},{"v":6400,"tol":1,"fb":"6 400 kWh, c’est la consommation des nouveaux lampadaires. On demande l’économie."}],"fb":"Reprends : économie par lampadaire (100 − 40 W) × 4 000 h, puis × 40 lampadaires, et convertis en kWh."},{"question":"Les techniciens pilotent les lampadaires depuis un logiciel en ligne. Quelle organisation protège le mieux ce système ?","options":[{"t":"Un compte par technicien, avec double authentification et mises à jour régulières","ok":true,"fb":"Des accès individuels, renforcés et à jour limitent les risques et permettent de savoir qui a fait quoi."},{"t":"Un seul compte administrateur avec un mot de passe très long, partagé par l’équipe","ok":false,"fb":"Un mot de passe partagé circule : une seule fuite ouvre tout, et on ne sait plus qui a fait quoi."},{"t":"Garder l’adresse du logiciel secrète","ok":false,"fb":"Cacher une adresse ne protège pas longtemps : les robots d’attaque testent toutes les adresses."},{"t":"Couper la connexion du système chaque nuit","ok":false,"fb":"C’est justement la nuit que les lampadaires doivent être pilotés."}]},{"question":"Chaque lampadaire baisse à 30 % de sa puissance quand un détecteur de présence ne voit personne. Dans cette chaîne, quel élément est l’actionneur ?","options":[{"t":"La lampe LED et son alimentation","ok":true,"fb":"C’est elle qui agit sur l’environnement en éclairant plus ou moins."},{"t":"Le détecteur de présence","ok":false,"fb":"Le détecteur acquiert une information : c’est un capteur."},{"t":"La carte de commande du lampadaire","ok":false,"fb":"La carte traite l’information et décide : elle n’agit pas directement."},{"t":"Le module radio vers la mairie","ok":false,"fb":"Le module radio communique l’état du lampadaire : il appartient à la fonction « communiquer »."}]}],"hint":"Étape 1 : différence de puissance × durée × nombre de lampadaires. Étape 3 : l’actionneur est l’élément qui agit sur le monde réel.","retenir":"Une solution technique s’évalue sur plusieurs critères à la fois : énergie, sécurité, fonctionnement."},"f2":{"type":"steps","scene":{"type":"robot","nom":"Atelier central"},"consigne":"L’entreprise veut un robot de livraison plus durable. Trois décisions à prendre : son programme, son matériau, sa réparabilité.","steps":[{"question":"Le robot doit éviter les obstacles et rentrer à sa base quand sa batterie descend sous 20 %. Quel programme convient ?","options":[{"t":"RÉPÉTER : mesurer distance et batterie ; SI batterie < 20 % ALORS rentrer à la base, SINON SI obstacle proche ALORS s’arrêter, SINON avancer","ok":true,"fb":"Les deux mesures sont mises à jour à chaque tour et la batterie faible est traitée en priorité."},{"t":"Mesurer la batterie au démarrage, puis RÉPÉTER : mesurer la distance ; SI obstacle proche ALORS s’arrêter, SINON avancer","ok":false,"fb":"La batterie n’est mesurée qu’une fois : le robot ne saura jamais qu’elle se vide pendant la tournée."},{"t":"RÉPÉTER : mesurer la distance ; SI obstacle proche ALORS rentrer à la base, SINON avancer","ok":false,"fb":"Le robot rentrerait à chaque obstacle, et la batterie n’est jamais surveillée."},{"t":"Mesurer distance et batterie ; SI batterie < 20 % ALORS rentrer, SINON avancer","ok":false,"fb":"Sans boucle, ces instructions ne s’exécutent qu’une fois, et l’obstacle n’est pas géré."}]},{"question":"Pour la coque, quel matériau est le plus cohérent avec un robot écoresponsable ?","doc":{"titre":"Comparatif","table":{"head":["Matériau","Masse de la coque","Recyclabilité","Prix"],"rows":[["Plastique recyclé","600 g","Recyclable","8 €"],["Aluminium","900 g","Très bien recyclable","20 €"],["Acier","1 800 g","Recyclable","12 €"],["Plastique neuf","550 g","Peu recyclé en pratique","6 €"]]}},"options":[{"t":"Le plastique recyclé","ok":true,"fb":"Léger (moins d’énergie à chaque trajet), issu du recyclage et peu cher : bon compromis."},{"t":"L’acier","ok":false,"fb":"Trois fois plus lourd : le robot consommerait davantage d’énergie à chaque déplacement."},{"t":"Le plastique neuf","ok":false,"fb":"Un peu plus léger, mais fabriqué à partir de matière neuve et peu recyclé en pratique."},{"t":"L’aluminium","ok":false,"fb":"Très bien recyclable, mais plus lourd et plus cher que le plastique recyclé pour ce petit robot."}]},{"question":"Quelle conception rend le robot le plus facile à réparer ?","options":[{"t":"Des pièces vissées, des vis standard et des pièces détachées disponibles","ok":true,"fb":"On remplace seulement la pièce défectueuse avec des outils courants : le robot dure plus longtemps."},{"t":"Une coque collée, plus étanche","ok":false,"fb":"La colle empêche d’ouvrir le robot sans le casser : la moindre panne peut le condamner."},{"t":"Une batterie soudée à la carte électronique","ok":false,"fb":"La batterie s’use la première : soudée, son remplacement devient presque impossible."},{"t":"Des vis spéciales que seul le fabricant peut ouvrir","ok":false,"fb":"Les réparations deviennent chères et dépendent d’un seul acteur."}]}],"hint":"Étape 1 : vérifie que chaque mesure est refaite à chaque tour de boucle. Étape 2 : un robot plus lourd consomme plus à chaque trajet.","retenir":"Un produit durable se pense dès la conception : programme fiable, matériaux adaptés, réparabilité."},"f3":{"type":"steps","scene":{"type":"icon","icone":"🏫","nom":"Défi final"},"consigne":"Le collège prépare son « campus du futur ». Trois choix à justifier : la mobilité, l’équipement numérique, les essais avant déploiement.","steps":[{"type":"numeric","doc":{"titre":"Données","lignes":["Un parent fait 8 km par jour en voiture pour déposer et reprendre son enfant.","Voiture thermique : 0,22 kg CO₂e par km.","140 jours de trajet par an."]},"question":"Combien de kg de CO₂e ces trajets émettent-ils en un an ?","unit":"kg CO₂e","answer":246.4,"tol":0.6,"errors":[{"v":1120,"tol":1,"fb":"1 120 est la distance annuelle en km. Multiplie par 0,22 kg par km."},{"v":1.76,"tol":0.02,"fb":"C’est l’émission d’une seule journée. Multiplie par 140 jours."},{"v":123.2,"tol":0.6,"fb":"Les 8 km comprennent déjà l’aller et le retour : ne divise pas par 2."}],"fb":"Reprends : 8 km × 140 jours × 0,22 kg/km."},{"question":"Le collège doit équiper une classe de 30 tablettes. Quel choix réduit le plus l’impact environnemental ?","options":[{"t":"Des tablettes reconditionnées, avec une garantie et des coques de protection","ok":true,"fb":"Le reconditionnement évite de fabriquer des appareils neufs, l’étape qui pèse le plus."},{"t":"Des tablettes neuves, plus économes en énergie à la recharge","ok":false,"fb":"La recharge pèse peu : fabriquer 30 appareils neufs pèse beaucoup plus."},{"t":"Des tablettes neuves, renouvelées tous les deux ans pour rester à jour","ok":false,"fb":"Renouveler souvent multiplie les fabrications."},{"t":"Des tablettes d’occasion sans garantie, au prix le plus bas","ok":false,"fb":"Sans garantie, les pannes risquent de les envoyer vite à la casse."}]},{"question":"Avant d’installer le nouveau système d’éclairage automatique dans tout le collège, que doit faire l’équipe ?","options":[{"t":"Tester un prototype dans une salle et vérifier sécurité, consommation et confort","ok":true,"fb":"Un essai en conditions réelles permet de corriger avant de déployer partout."},{"t":"Comparer seulement le prix d’achat des solutions","ok":false,"fb":"Le prix d’achat ne dit rien de la consommation, de la sécurité ou de la durée de vie."},{"t":"Installer partout d’un coup pour gagner du temps","ok":false,"fb":"Une erreur serait reproduite dans toutes les salles."},{"t":"Faire confiance à la fiche commerciale du fabricant","ok":false,"fb":"Une fiche commerciale ne remplace pas un essai dans les conditions du collège."}]}],"hint":"Étape 1 : distance annuelle × émissions par km. Étape 2 : quelle étape du cycle de vie d’un appareil numérique pèse le plus ?","retenir":"Concevoir un projet durable, c’est chiffrer les impacts, prolonger la vie des objets et tester avant de déployer."}}</script>
